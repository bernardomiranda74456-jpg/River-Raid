<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Raid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }
    canvas {
      display: block;
      border: 2px solid #333;
      image-rendering: pixelated;
    }
    #controls {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="controls">SETAS: Mover &nbsp;|&nbsp; ESPAÇO: Atirar &nbsp;|&nbsp; WASD também funciona</div>
  <script src="game.js"></script>
</body>
</html>
