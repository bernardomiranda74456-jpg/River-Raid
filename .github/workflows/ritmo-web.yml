name: Ritmo web (GitHub Pages)

# Publica a versão web do Ritmo em https://<usuario>.github.io/River-Raid/ritmo/
# Pré-requisito (uma vez): Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: ['claude/ritmo-workout-challenge-app-azzfd4', 'main']
    paths: ['ritmo/**', '.github/workflows/ritmo-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ritmo }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ritmo/package-lock.json }
      - run: npm ci
      - name: Exportar versão web
        env:
          # Opcional: defina estas variáveis em Settings → Secrets and variables → Actions → Variables.
          # Sem elas, o app pede a URL e a publishable key na primeira abertura.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_TESTFLIGHT_URL: ${{ vars.EXPO_PUBLIC_TESTFLIGHT_URL }}
        run: ./scripts/build-web.sh "/${{ github.event.repository.name }}/ritmo"
      - name: Montar site (a raiz continua com os jogos do repositório)
        run: |
          mkdir -p ../_site/ritmo
          cp -r dist/. ../_site/ritmo/
          cp ../index.html ../*.html ../_site/ 2>/dev/null || true
          cp -r ../enduro ../pitfall ../truco ../_site/ 2>/dev/null || true
          cp ../game.js ../_site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
