name: Ritmo

on:
  push:
    paths: ['ritmo/**', '.github/workflows/ritmo.yml']
  pull_request:
    paths: ['ritmo/**', '.github/workflows/ritmo.yml']

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ritmo }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ritmo/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/db-test.sh
        working-directory: ritmo
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
