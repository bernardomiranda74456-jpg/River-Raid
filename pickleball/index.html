<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Pickleball Forever: jogo de pickleball para celular com simples, duplas, 1 ou 2 jogadores e regras oficiais.">
<title>Pickleball Forever</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; background: #0b131d; color: #eaf2f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; }
  canvas {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0;
    width: 100%; height: 100%; display: block; touch-action: none;
  }

  .screen {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding: calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 50% 0%, #1d3a56 0%, #0b131d 62%);
    overflow-y: auto; z-index: 10;
  }
  .screen.on { display: flex; }
  .screen.sheet {
    background: rgba(6, 11, 18, 0.88);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }

  /* Entry screen: the company mark comes up out of the dark, and stays up —
     the cut to the menu happens with the logo at full strength, no fade out. */
  #scr-splash { background: radial-gradient(120% 90% at 50% 45%, #16293c 0%, #080e16 68%); }
  #scr-splash img {
    display: block; width: min(64vw, 340px); height: auto;
    opacity: 0; transform: scale(0.94);
    animation: splash-in 1300ms cubic-bezier(0.42, 0, 0.58, 1) forwards;
  }
  @keyframes splash-in {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #scr-splash img { animation: none; opacity: 1; transform: none; }
  }

  h1 { font-size: clamp(30px, 10vw, 52px); letter-spacing: 2px; font-weight: 800; }
  h1 span { color: #d9ff3d; }
  /* the wordmark replaces the typed title on the entry screen */
  h1.logo { margin: 0; line-height: 0; width: min(86vw, 420px); }
  h1.logo img {
    display: block; width: 100%; height: auto;
    max-height: min(34vh, 260px); object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
  }
  /* Lying down there is room sideways, not vertically: the wordmark moves to
     the left of the buttons and is sized by its height, never letterboxed. */
  .title-side { display: contents; }
  @media (orientation: landscape) and (max-height: 560px) {
    #scr-title { flex-direction: row; gap: 24px; justify-content: center; }
    .title-side {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: min(46vw, 380px);
    }
    h1.logo { width: auto; }
    h1.logo img { width: auto; height: min(54vh, 215px); max-height: none; }
  }
  h2 { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
  .tag { color: #8fa7bb; font-size: 13px; text-align: center; max-width: 320px; line-height: 1.45; }

  .card { width: min(400px, 100%); display: flex; flex-direction: column; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 7px; }
  .label { font-size: 11px; letter-spacing: 1.4px; color: #7f9ab1; font-weight: 700; text-transform: uppercase; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt {
    flex: 1 1 0; min-width: 92px; padding: 12px 8px; border-radius: 12px; border: 1.5px solid #24384c;
    background: #131f2c; color: #cfe0ee; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .06s ease, background .15s, border-color .15s;
  }
  .opt small { display: block; font-weight: 500; font-size: 11px; color: #7f9ab1; margin-top: 3px; }
  .opt[aria-pressed="true"] { background: #1d4f74; border-color: #4fd0ff; color: #fff; }
  .opt[aria-pressed="true"] small { color: #b9e6ff; }
  .opt:active { transform: scale(.97); }
  .opt[hidden] { display: none; }

  .btn {
    padding: 15px 22px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800;
    background: #d9ff3d; color: #12202c; cursor: pointer; letter-spacing: .5px; width: 100%;
  }
  .btn.ghost { background: transparent; border: 1.5px solid #2c4258; color: #cfe0ee; font-weight: 600; }
  .btn.outline { background: #14293a; border: 1.5px solid #4fd0ff; color: #9fe4ff; letter-spacing: 1.5px; }

  /* ── tutorial ───────────────────────────────────────────────────────── */
  #scr-tutorial { justify-content: flex-start; gap: 0; padding-top: calc(14px + env(safe-area-inset-top)); }
  .tut { width: min(460px, 100%); display: flex; flex-direction: column; gap: 12px; margin: auto 0; }
  .tut-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tut-step { font-size: 11px; letter-spacing: 1.6px; font-weight: 800; color: #7f9ab1; }
  .tut-home {
    padding: 8px 13px; border-radius: 999px; border: 1.5px solid #2c4258;
    background: rgba(12,22,34,.8); color: #cfe0ee; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .tut-home:active { transform: scale(.97); }
  .tut-dots { display: flex; gap: 5px; justify-content: center; }
  .tut-dots i { width: 6px; height: 6px; border-radius: 50%; background: #263d52; transition: background .2s, width .2s; }
  .tut-dots i.on { background: #d9ff3d; width: 18px; border-radius: 3px; }

  .tut-card { background: #101c28; border: 1px solid #1e3346; border-radius: 16px; overflow: hidden; }
  .tut-stage {
    position: relative; height: 168px; background:
      radial-gradient(120% 140% at 50% 0%, #1b3a55 0%, #0d1a26 78%);
    border-bottom: 1px solid #1e3346; overflow: hidden;
  }
  /* the art box keeps the court's aspect, so the animated finger lines up with
     the drawing instead of drifting onto the letterboxing */
  .tut-art {
    position: absolute; inset: 0; margin: auto;
    aspect-ratio: 300 / 168; max-width: 100%; max-height: 100%;
  }
  .tut-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tut-body { padding: 13px 15px 15px; }
  .tut-body h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  .tut-body p { font-size: 13.5px; line-height: 1.5; color: #cfe0ee; }
  .tut-body p + p { margin-top: 7px; }
  .tut-body b { color: #d9ff3d; }
  .tut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 9px; }
  .tut-grid div {
    background: #0c1622; border: 1px solid #1e3346; border-radius: 9px;
    padding: 8px 9px; font-size: 12px; line-height: 1.4; color: #b6cadb;
  }
  .tut-grid b { display: block; color: #d9ff3d; font-size: 12.5px; margin-bottom: 1px; }
  .tut-grid b i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .tut-nav { display: flex; gap: 9px; }
  .tut-nav .btn { padding: 13px 16px; font-size: 14.5px; }
  .tut-nav .btn:disabled { opacity: .35; }

  /* animated finger */
  .hand {
    position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px;
    border-radius: 50%; background: rgba(217,255,61,.92);
    box-shadow: 0 0 0 9px rgba(217,255,61,.14), 0 0 16px rgba(217,255,61,.5);
  }
  .hand.drag { top: 66%; animation: h-drag 2.8s ease-in-out infinite; }
  @keyframes h-drag { 0%,100% { left: 26% } 50% { left: 74% } }
  .hand.flick { left: 50%; animation: h-flick 1.9s cubic-bezier(.3,0,.2,1) infinite; }
  @keyframes h-flick {
    0%, 18% { top: 78%; opacity: 1 }
    45% { top: 30%; opacity: 1 }
    62% { top: 26%; opacity: 0 }
    63%, 100% { top: 78%; opacity: 0 }
  }
  .hand.tap { left: 50%; top: 62%; animation: h-tap 1.8s ease-out infinite; }
  @keyframes h-tap { 0%, 60% { transform: scale(1); opacity: .95 } 75% { transform: scale(1.9); opacity: .25 } 100% { transform: scale(1); opacity: .95 } }
  .streak { position: absolute; opacity: .45; }
  .ball-dot {
    position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px;
    border-radius: 50%; background: #d9ff3d; box-shadow: 0 0 10px rgba(217,255,61,.6);
  }
  .ball-dot.hop { animation: b-hop 2.4s ease-in-out infinite; }
  @keyframes b-hop {
    0% { left: 50%; top: 18% } 22% { left: 50%; top: 72% }
    34% { left: 50%; top: 52% } 50% { left: 50%; top: 74% }
    68% { left: 50%; top: 60% } 100% { left: 50%; top: 74% }
  }
  @media (prefers-reduced-motion: reduce) {
    .hand, .ball-dot.hop { animation: none !important; }
  }
  /* a short landscape window has no room for a stacked card, so the art moves
     beside the text and the buttons stay on screen */
  @media (orientation: landscape) and (max-height: 560px) {
    .tut { width: min(760px, 100%); gap: 9px; }
    .tut-card { display: grid; grid-template-columns: 46% 1fr; }
    .tut-stage { height: 100%; min-height: 148px; border-bottom: none; border-right: 1px solid #1e3346; }
    .tut-body { padding: 11px 13px; }
    .tut-body h3 { font-size: 15.5px; }
    .tut-body p { font-size: 12.5px; }
  }
  .btn:active { transform: scale(.98); }
  .row { display: flex; gap: 10px; width: min(400px, 100%); }

  #pauseBtn {
    position: absolute; z-index: 6; top: calc(10px + env(safe-area-inset-top)); right: 12px;
    width: 42px; height: 42px; border-radius: 12px; border: none;
    background: rgba(9,16,24,.72); color: #eaf2f8; font-size: 15px; cursor: pointer; display: none;
  }
  #pauseBtn.on { display: block; }

  .how { width: min(420px, 100%); display: flex; flex-direction: column; gap: 11px; }
  .how div { background: #101c28; border: 1px solid #1e3346; border-radius: 12px; padding: 11px 13px; font-size: 13.5px; line-height: 1.5; color: #cfe0ee; }
  .how b { color: #d9ff3d; }
  .final { font-size: 46px; font-weight: 800; letter-spacing: 2px; }
  .muted { color: #7f9ab1; font-size: 13px; }
  .foot { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 11px; color: #4d6478; }

  /* language: three flags, the chosen one lit */
  .langs { display: flex; gap: 12px; justify-content: center; }
  .lang {
    width: 48px; height: 32px; padding: 0; border-radius: 7px; cursor: pointer;
    background: none; border: 2px solid transparent; opacity: 0.45;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, border-color .15s, transform .15s;
  }
  .lang svg { width: 100%; height: 100%; border-radius: 5px; display: block; }
  .lang[aria-pressed="true"] { opacity: 1; border-color: #d9ff3d; transform: translateY(-1px); }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <button id="pauseBtn" data-i18n-aria="ui.pauseBtn" aria-label="Pausar">⏸</button>

  <!-- entrada -->
  <section id="scr-splash" class="screen on">
    <img src="img/3emp.png" alt="3EMP" width="560" height="203" decoding="async">
  </section>

  <!-- título -->
  <section id="scr-title" class="screen">
    <h1 class="logo"><img src="img/logo.png" alt="Pickleball Forever" width="900" height="606" decoding="async"></h1>
    <div class="title-side">
      <p class="tag" data-i18n="ui.tag">Simples ou duplas contra a CPU. Regras oficiais, cozinha e tudo.</p>
      <div class="card">
        <button class="btn outline" id="btn-tutorial" data-i18n="ui.tutorial">TUTORIAL</button>
        <button class="btn" id="btn-play" data-i18n="ui.play">JOGAR</button>
        <button class="btn ghost" id="btn-sound">Som</button>
      </div>
    <div class="langs" id="langs" role="group" data-i18n-aria="ui.language">
      <button class="lang" data-lang="pt" data-i18n-aria="lang.name.pt"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" rx="3" fill="#159b41"/><path d="M15 2.6 27.4 10 15 17.4 2.6 10Z" fill="#fedf00"/><circle cx="15" cy="10" r="4.4" fill="#002776"/><path d="M10.9 8.3a8 8 0 0 1 8.3 2.5" stroke="#fff" stroke-width="1.5" fill="none"/></svg></button>
      <button class="lang" data-lang="en" data-i18n-aria="lang.name.en"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" rx="3" fill="#fff"/><g fill="#b22234"><rect width="30" height="1.54" y="0"/><rect width="30" height="1.54" y="3.08"/><rect width="30" height="1.54" y="6.15"/><rect width="30" height="1.54" y="9.23"/><rect width="30" height="1.54" y="12.31"/><rect width="30" height="1.54" y="15.38"/><rect width="30" height="1.54" y="18.46"/></g><rect width="13" height="10.77" fill="#3c3b6e"/><g fill="#fff"><circle cx="2.6" cy="2.2" r=".8"/><circle cx="6.5" cy="2.2" r=".8"/><circle cx="10.4" cy="2.2" r=".8"/><circle cx="4.5" cy="5.4" r=".8"/><circle cx="8.4" cy="5.4" r=".8"/><circle cx="2.6" cy="8.5" r=".8"/><circle cx="6.5" cy="8.5" r=".8"/><circle cx="10.4" cy="8.5" r=".8"/></g></svg></button>
      <button class="lang" data-lang="es" data-i18n-aria="lang.name.es"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" rx="3" fill="#c60b1e"/><rect width="30" height="10" y="5" fill="#ffc400"/></svg></button>
    </div>
    </div>
    <div class="foot"><!--VERSION--> &middot; <span data-i18n="ui.tip">Dica: vire o celular na horizontal</span></div>
  </section>

  <!-- configuração -->
  <section id="scr-setup" class="screen">
    <div class="card">
      <h2 data-i18n="ui.setup">Configurar partida</h2>
      <div class="group">
        <div class="label" data-i18n="ui.format">Formato</div>
        <div class="opts" data-group="format">
          <button class="opt" data-val="singles"><span data-i18n="ui.format.singles">Simples</span><small data-i18n="ui.format.singles.sub">1 contra 1</small></button>
          <button class="opt" data-val="doubles"><span data-i18n="ui.format.doubles">Duplas</span><small data-i18n="ui.format.doubles.sub">2 contra 2</small></button>
        </div>
      </div>
      <div class="group">
        <div class="label" data-i18n="ui.chars">Desenho dos jogadores</div>
        <div class="opts" data-group="charStyle">
          <button class="opt" data-val="boneco"><span data-i18n="ui.chars.boneco">Boneco</span><small data-i18n="ui.chars.boneco.sub">estilo Wii</small></button>
          <button class="opt" data-val="atletico"><span data-i18n="ui.chars.atletico">Atlético</span><small data-i18n="ui.chars.atletico.sub">proporção real</small></button>
          <button class="opt" data-val="vetor"><span data-i18n="ui.chars.vetor">Vetor</span><small data-i18n="ui.chars.vetor.sub">contorno</small></button>
          <button class="opt" data-val="arcade"><span data-i18n="ui.chars.arcade">Arcade</span><small data-i18n="ui.chars.arcade.sub">cabeçudo</small></button>
        </div>
      </div>
      <div class="group">
        <div class="label" data-i18n="ui.diff">Dificuldade</div>
        <div class="opts" data-group="difficulty">
          <button class="opt" data-val="facil"><span data-i18n="ui.diff.facil">Fácil</span><small data-i18n="ui.diff.facil.sub">golpe automático</small></button>
          <button class="opt" data-val="normal"><span data-i18n="ui.diff.normal">Normal</span><small data-i18n="ui.diff.normal.sub">faltas assistidas</small></button>
          <button class="opt" data-val="dificil"><span data-i18n="ui.diff.dificil">Difícil</span><small data-i18n="ui.diff.dificil.sub">sem perdão</small></button>
        </div>
      </div>
      <div class="group">
        <div class="label" data-i18n="ui.upto">Partida até</div>
        <div class="opts" data-group="targetPoints">
          <button class="opt" data-val="7" data-i18n-points="7">7 pontos</button>
          <button class="opt" data-val="11" data-i18n-points="11">11 pontos</button>
          <button class="opt" data-val="15" data-i18n-points="15">15 pontos</button>
        </div>
      </div>
      <button class="btn" id="btn-start" data-i18n="ui.start">COMEÇAR</button>
      <button class="btn ghost" id="btn-back" data-i18n="ui.back">Voltar</button>
    </div>
  </section>

  <!-- tutorial -->
  <section id="scr-tutorial" class="screen">
    <div class="tut">
      <div class="tut-top">
        <span class="tut-step" id="tut-step">PASSO 1 DE 8</span>
        <button class="tut-home" id="btn-tut-home" data-i18n="ui.tut.home">Menu principal</button>
      </div>
      <div class="tut-dots" id="tut-dots"></div>
      <div class="tut-card">
        <div class="tut-stage" id="tut-stage"></div>
        <div class="tut-body" id="tut-body"></div>
      </div>
      <div class="tut-nav">
        <button class="btn ghost" id="btn-tut-prev" data-i18n="ui.tut.prev">Voltar</button>
        <button class="btn" id="btn-tut-next">Próximo</button>
      </div>
    </div>
  </section>

  <!-- pausa -->
  <section id="scr-pause" class="screen sheet">
    <div class="card">
      <h2 data-i18n="ui.pause">Pausa</h2>
      <button class="btn" id="btn-resume" data-i18n="ui.resume">Continuar</button>
      <button class="btn ghost" id="btn-restart" data-i18n="ui.restart">Reiniciar partida</button>
      <button class="btn ghost" id="btn-quit" data-i18n="ui.quit">Sair para o menu</button>
    </div>
  </section>

  <!-- fim -->
  <section id="scr-over" class="screen sheet">
    <div class="card" style="align-items:center;text-align:center">
      <h2 id="over-title" data-i18n="ui.over">Fim de jogo</h2>
      <div class="final" id="over-score">11 - 5</div>
      <p class="muted" id="over-sub"></p>
      <button class="btn" id="btn-rematch" data-i18n="ui.rematch">Revanche</button>
      <button class="btn ghost" id="btn-menu" data-i18n="ui.menu">Menu</button>
    </div>
  </section>
</div>

<script src="js/i18n.js"></script>
<script src="js/court.js"></script>
<script src="js/physics.js"></script>
<script src="js/shots.js"></script>
<script src="js/ai.js"></script>
<script src="js/stroke.js"></script>
<script src="js/match.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/applause.js"></script>
<script src="js/calls.js"></script>
<script src="js/logos.js"></script>
<script src="js/audio.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
